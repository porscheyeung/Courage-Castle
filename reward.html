<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>
<div class="shell">
 <header class="top">
  <a class="back-link" href="./" aria-label="返回勇氣城堡"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg><span>勇氣城堡</span></a>
  <div class="brand"><span class="crest" aria-hidden="true"></span><div><h1>勇氣寶庫</h1><small>COURAGE TREASURY</small></div></div>
  <div class="top-tools"><button id="soundBtn" class="icon-btn" type="button"></button><button id="parentBtn" class="parent-btn" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>家長</span></button></div>
 </header>
 <nav class="tabs" id="tabs" aria-label="分頁">
  <button data-act="tab" data-tab="home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a6 6 0 0 1 6-6h6a6 6 0 0 1 6 6v10H3z"/><path d="M3 12h18M10 12v3h4v-3"/></svg><span>寶箱</span></button>
  <button data-act="tab" data-tab="bag"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>寶物袋</span><b class="tab-badge" hidden></b></button>
  <button data-act="tab" data-tab="dex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg><span>圖鑑</span></button>

 </nav>
 <main id="view" class="view"></main>
 <footer class="foot">勇敢完成 <span>✦</span> 打開寶箱 <span>✦</span> 每一分努力都值得獎勵</footer>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="engine.js"></script>
<script src="reward/reward-engine.js"></script>
<script src="reward/reward-app.js"></script>
