<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9eee4">
<meta name="description" content="完成一題，砌一塊積木；勇敢改正，城堡就多一盞燈。">
<title>勇氣城堡 V3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
 <header class="top">
  <div class="identity"><div class="logo" aria-hidden="true">🏰</div><div class="titles"><h1 id="title">勇氣城堡</h1><small id="subtitle">COURAGE CASTLE V3 · 一題一積木，改正亮一盞燈</small></div></div>
  <div class="tools">
   <button id="nightBtn" class="tool wide" title="切換日夜">🌙 <span>夜景</span></button>
   <button id="sound" class="tool desk" title="音效" aria-label="音效">♫</button>
   <button id="fullscreen" class="tool desk" title="全螢幕" aria-label="全螢幕">⛶</button>
   <button id="settings" class="tool" title="設定" aria-label="設定">⚙</button>
  </div>
 </header>
 <div class="layout">
  <section class="stage" id="stage" aria-label="城堡畫面">
   <svg id="castleSvg" class="kingdom-svg" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet" role="img" aria-label="勇氣積木城堡"></svg>
   <div class="chip chip-left" id="chipLeft"></div>
   <div class="chip chip-right" id="chipRight"></div>
   <div class="scene-tools"><button id="fitAll" title="觀看整個王國">全景</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="縮小">−</button><button id="goHome" aria-label="返回城堡" title="返回城堡">🏰</button></div>
   <button id="replayCelebration" class="replay-celebration" hidden>🎆 再放煙花</button>
   <div id="bubble" class="bubble" hidden></div>
   <canvas id="fireworks"></canvas>
  </section>
  <aside class="panel">
   <div class="card progress-card">
    <div class="p-label" id="progLabel">原定目標</div>
    <div class="p-row"><div class="count" aria-live="polite"><strong id="current">0</strong><span>/ <span id="goalText">100</span> 題</span></div><div class="p-lamps" id="lampText">💡 0 盞</div></div>
    <div class="bar"><div id="barfill" class="barfill"></div></div>
   </div>
   <div class="say" id="say" role="status" aria-live="polite"><span id="sayText"></span><button id="sayAction" class="say-action" hidden></button></div>
   <div class="actions">
    <button id="add" class="bigbtn buildbtn"></button>
    <button id="shine" class="bigbtn shinebtn"></button>
   </div>
   <button id="finish" class="finishbtn" hidden>👑 我的王國完成了！</button>
   <div class="mini-grid">
    <button id="garlandBtn" class="mini">💡 <span>燈串</span></button>
    <button id="diaryBtn" class="mini">📒 <span>日記</span></button>
    <button id="replayBtn" class="mini">🎬 <span>回放</span></button>
    <button id="undo" class="mini">↶ <span>復原</span></button>
   </div>
   <div class="card stats" id="stats"></div>
  </aside>
 </div>
 <footer>一題一積木 <span>✦</span> 改正亮一盞燈 <span>✦</span> 每一次努力都值得被看見</footer>
</main>
<div class="overlay hidden" id="overlay"><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div id="printArea" class="print-area" aria-hidden="true"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
