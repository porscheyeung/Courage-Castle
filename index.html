/* Hide the redundant scene caption: it used to sit underneath the progress panel. */
.stage .hint{display:none!important}
.top{flex-wrap:wrap}
.identity,.identity>div:last-child{min-width:0}
h1{overflow-wrap:anywhere}
.app{padding-bottom:max(18px,env(safe-area-inset-bottom,18px))}

 .scene-tools{z-index:14}
 .toast{top:30%;max-width:90vw}
}

/* New scenery blooms in its own reserved space, instead of falling through
   neighbouring houses, animals or guardians on the way down. */
.kingdom-svg #kingdomExtras .new-object{animation:v2-bloom .65s cubic-bezier(.2,1,.45,1) both}
@keyframes v2-bloom{
 0%{transform:scale(.58);opacity:0}
 75%{transform:scale(1.045);opacity:1}
 100%{transform:scale(1);opacity:1}
}

<script>
// Courage Castle V2 — deterministic building, free expansion and keepsake export.
(() => {
'use strict';
const $=id=>document.getElementById(id), K2='courage-castle-save-v2',K1='courage-castle-save-v1',svg=$('castleSvg');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const themes={garden:['🌷','夢幻花園','花朵、小樹、蝴蝶'],village:['🏡','勇氣小村莊','小屋、石路、路燈'],guards:['🛡️','勇氣守護隊','可愛守衛、盾牌、小馬'],party:['🎈','王國慶典','氣球、彩旗、星星']};
const palettes=[['#e7aebb','#adc8e4','#c6b0de','#eed19a','#b7d6c4'],['#a5cbe4','#b5ddd6','#d4b8e5','#f2d298','#e4b8bb'],['#b3d5ba','#e6c293','#a9c9e1','#e3b7d6','#efb4a5'],['#eec2a3','#e6a7ae','#f3d9ab','#b3cde1','#cbb5d5'],['#d4aedf','#a7c9dc','#efd99e','#a9d0b8','#edb9bd']];
const cheerful=['又完成一題！','努力又累積了一點！','你的王國慢慢長大！','每一步都很珍貴！'];
const courage=['勇敢改正，真了不起！','錯誤也是學習的機會！','願意再試一次，就是勇氣！','你為王國添了一道光芒！'];
const fresh=()=>({version:2,name:'小小建築師',kingdom:'',target:100,seed:2026,sound:true,history:[],themes:{},finalized:false,finalDate:null});
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cam={x:500,y:380,zoom:1},drag=null,moved=false;
let panFrame=null;
const seed=()=>Math.floor(Math.random()*2147483640)+1;
function rand(i,s=0){let x=(Math.imul(i+13,374761393)+Math.imul(state.seed,668265263)+s)>>>0;x=Math.imul(x^(x>>>13),1274126177);return ((x^(x>>>16))>>>0)/4294967296;}

function readData(d){
 if(!d||d.version!==2||!Number.isInteger(d.target)||d.target<1||d.target>500||!Array.isArray(d.history)||d.history.length>25000)return null;
 let x=fresh();x.target=d.target;x.seed=Number.isInteger(d.seed)?d.seed:seed();x.name=String(d.name||'小小建築師').slice(0,30);x.kingdom=String(d.kingdom||'').slice(0,40);x.sound=d.sound!==false;
 x.history=d.history.filter(a=>a&&['add','extra','shine'].includes(a.type)&&typeof a.id==='string'&&a.id.length<50).slice(0,25000);
 for(const [k,v] of Object.entries(d.themes||{}))if(/^\d{1,4}$/.test(k)&&themes[v])x.themes[k]=v;

}
function load(){
 try{
  let saved=readData(JSON.parse(localStorage.getItem(K2)||'null'));
  if(saved){state=saved;makeSlots();replay();return true;}
  const v1=JSON.parse(localStorage.getItem(K1)||'null');
  if(!v1||v1.version!==1||!Number.isInteger(v1.target)||v1.target<1||v1.target>500||!Array.isArray(v1.history))return false;
  state=fresh();state.target=v1.target;state.seed=Number.isInteger(v1.seed)?v1.seed:seed();state.sound=v1.sound!==false;
  state.history=v1.history.filter(e=>e&&Number.isInteger(e.slot)&&(e.type==='add'||e.type==='shine')).map(e=>({type:e.type,id:`c${e.slot}`}));

}
function split(n,weights){

 const left=n-out.reduce((a,b)=>a+b,0);
 vals.map((v,i)=>({i,f:v-out[i]})).sort((a,b)=>b.f-a.f).slice(0,left).forEach(x=>out[x.i]++);
 return out;
}
function section(a,count){
 if(!count)return[];
 const rows=clamp(Math.round(Math.sqrt(count*a.h/a.w)),1,count),out=[];let left=count;
 for(let r=0;r<rows;r++){
  let cols=Math.ceil(left/(rows-r));left-=cols;
  for(let c=0;c<cols;c++){let w=a.w/cols,h=a.h/rows;out.push({x:a.x+c*w,y:a.y+a.h-(r+1)*h,w,h,section:a.id});}
 }
 return out;
}
function makeSlots(){
 const n=state.target;let areas;
 if(n<8)areas=[{x:425,y:424,w:150,h:130,id:'mini'}];
 else if(shape()===0)areas=[{x:255,y:280,w:120,h:273,id:'left'},{x:625,y:280,w:120,h:273,id:'right'},{x:375,y:413,w:96,h:140,id:'wingL'},{x:529,y:413,w:96,h:140,id:'wingR'},{x:471,y:332,w:58,h:221,id:'keep'}];
 else if(shape()===1)areas=[{x:270,y:330,w:116,h:223,id:'left'},{x:614,y:330,w:116,h:223,id:'right'},{x:386,y:423,w:72,h:130,id:'wingL'},{x:542,y:423,w:72,h:130,id:'wingR'},{x:458,y:236,w:84,h:317,id:'keep'}];
 else areas=[{x:260,y:345,w:106,h:208,id:'left'},{x:447,y:285,w:106,h:268,id:'keep'},{x:634,y:345,w:106,h:208,id:'right'},{x:366,y:437,w:81,h:116,id:'wingL'},{x:553,y:437,w:81,h:116,id:'wingR'}];
 let weights=areas.map(a=>a.w*a.h),sum=weights.reduce((a,b)=>a+b,0),numbers=split(n,weights.map(w=>w/sum)),c=colors();
 let all=areas.flatMap((a,i)=>section(a,numbers[i]));
 all.sort((a,b)=>(b.y+b.h)-(a.y+a.h)||Math.abs(a.x-500)-Math.abs(b.x-500));

}
function replay(){
 built=[];extra=[];lit=new Set();const good=[];
 for(const e of state.history){
  if(e.type==='add'&&built.length<state.target&&e.id===`c${built.length}`){built.push(e.id);good.push(e);}
  else if(e.type==='extra'&&complete()&&e.id===`e${extra.length}`){extra.push(e.id);good.push(e);}
  else if(e.type==='shine'&&(built.includes(e.id)||extra.includes(e.id))&&!lit.has(e.id)){lit.add(e.id);good.push(e);}
 }
 state.history=good;
}
function star(x,y,r=12){
 const p=Array.from({length:10},(_,i)=>{let a=-Math.PI/2+i*Math.PI/5,d=i%2?r*.45:r;return `${x+Math.cos(a)*d},${y+Math.sin(a)*d}`;}).join(' ');

}
function dark(hex,f){return '#'+[1,3,5].map(i=>clamp(Math.round(parseInt(hex.slice(i,i+2),16)*f),0,255).toString(16).padStart(2,'0')).join('');}
function brick(s,id){
 const glow=lit.has(id),col=glow?'#f5cd77':s.color,edge=dark(col,.8),light=dark(col,1.13),r=Math.min(5,s.h*.16),side=Math.max(1.7,s.w*.08);
 return `<g data-oid="${id}" class="object-selectable ${glow?'sparkling':''} ${selected===id?'object-selected':''} ${newest===id?'new-object':''}">
 ${glow?`<ellipse cx="${s.x+s.w/2}" cy="${s.y+s.h/2}" rx="${s.w*.9}" ry="${s.h*1.1}" fill="url(#goldAura)"/>`:''}
 <rect x="${s.x+1}" y="${s.y+2}" width="${s.w-2}" height="${s.h-2}" rx="${r}" fill="${edge}"/>
 <rect x="${s.x+1}" y="${s.y+1}" width="${Math.max(1,s.w-side-2)}" height="${Math.max(1,s.h-4)}" rx="${r}" stroke="${edge}" stroke-width="1.5" fill="${col}"/>
 <path d="M${s.x+4} ${s.y+Math.min(7,s.h*.2)}Q${s.x+s.w*.5} ${s.y+1} ${s.x+s.w-side-4} ${s.y+Math.min(7,s.h*.2)}" fill="none" stroke="${light}" stroke-width="2"/>
 <rect x="${s.x+3}" y="${s.y+3}" width="${Math.max(0,s.w-side-5)}" height="${Math.max(0,s.h-7)}" fill="url(#grain)" opacity=".45" rx="${r}"/>
 ${glow?`<g class="twinkle">${star(s.x+s.w/2,s.y+s.h/2,Math.min(s.w,s.h)*.27)}</g>${star(s.x+s.w*.75,s.y+s.h*.24,Math.min(s.w,s.h)*.1)}`:''}</g>`;
}
function hat(part){
 const p=slots.filter(s=>s.section===part);
 if(!p.length||!p.every(s=>built.includes(s.id)))return '';
 const l=Math.min(...p.map(s=>s.x)),r=Math.max(...p.map(s=>s.x+s.w)),y=Math.min(...p.map(s=>s.y)),m=(l+r)/2,peak=y-(part==='keep'?55:65),col=colors()[2];
 return `<g class="flag-wave"><path d="M${l-8} ${y+2}L${m} ${peak}L${r+8} ${y+2}Z" fill="${col}" stroke="${dark(col,.76)}" stroke-width="4"/>
 <path d="M${m} ${peak}v-28" stroke="#9c8395" stroke-width="3"/><path d="M${m+2} ${peak-28}l33 11-33 14Z" fill="#f0be8f" stroke="#b99080" stroke-width="2"/></g>`;
}
function trim(){
 let t=['mini','left','right','keep'].map(hat).join('');
 if(complete())t+=`<path d="M465 554V495a35 35 0 0 1 70 0v59Z" fill="#bb937e" stroke="#947369" stroke-width="4"/>
 <path d="M500 461v93" stroke="#906d69" stroke-width="2"/><circle cx="488" cy="517" r="4" fill="#ffe9a1"/>
 ${star(500,128,12)}${star(221,349,9)}${star(778,355,9)}`;
 return t;
}
// V2.3: collision-aware organic layout. Once placed, coordinates remain
// deterministic, including after undo, reload, and keepsake export.
const meadowSequence=[1,0,3,2,5,4,0,1,2,3,4,5,1,0,3,2,4,5,0,1];
let layoutToken='',placedExtras=[],layoutBuckets=new Map();
const layoutCell=96;
function meadowZone(ch,zone){
 const expand=ch*93;
 const areas=[
  {x:135-expand,y:523,rx:83,ry:43},
  {x:865+expand,y:519,rx:86,ry:43},
  {x:137-expand*.85,y:389,rx:85,ry:48},
  {x:863+expand*.85,y:397,rx:85,ry:48},
  {x:66-expand*.60,y:462,rx:94,ry:54},
  {x:934+expand*.60,y:460,rx:95,ry:54}
 ];
 const a=areas[zone];
 return {...a,y:a.y+(rand(ch*11+zone,402)-.5)*21};
}
function extraScale(i){return .82+rand(i,813)*.33+(i%11===0?.16:0);}
function footprint(i,x,y){
 const type=themeAt(i),v=Math.floor(rand(i,318)*5),s=extraScale(i);
 let left=29,right=29,up=47,down=19;
 if(type==='village'){
  if(v===2){left=13;right=13;up=45;down=20;}
  else if(v===4){left=24;right=24;up=14;down=21;}
  else{left=26;right=26;up=46;down=20;}
 }else if(type==='guards'){
  if(v===2){left=45;right=28;up=41;down=29;}
  else{left=21;right=33;up=48;down=31;}
 }else if(type==='party'){left=29;right=35;up=64;down=19;}
 else if(v===3){left=32;right=32;up=46;down=18;}
 return {left:x-left*s-8,right:x+right*s+8,top:y-up*s-8,bottom:y+down*s+8};
}
function overlaps(a,b){
 return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
}
function cellsFor(rect){
 const cells=[];
 for(let x=Math.floor(rect.left/layoutCell);x<=Math.floor(rect.right/layoutCell);x++)
  for(let y=Math.floor(rect.top/layoutCell);y<=Math.floor(rect.bottom/layoutCell);y++)cells.push(`${x},${y}`);

}
function occupied(rect){
 for(const key of cellsFor(rect))
  for(const old of layoutBuckets.get(key)||[])if(overlaps(rect,old))return true;

}
function reserve(rect){
 for(const key of cellsFor(rect)){
  if(!layoutBuckets.has(key))layoutBuckets.set(key,[]);
  layoutBuckets.get(key).push(rect);

}
function positionFor(i){
 const ch=Math.floor(i/20),j=i%20;
 const zone=meadowSequence[(j+ch*3)%20];
 let seq=0;
 for(let k=0;k<j;k++)if(meadowSequence[(k+ch*3)%20]===zone)seq++;
 const a=meadowZone(ch,zone),offset=rand(ch*13+zone,706)*Math.PI*2;
 const castleArea={left:237,right:763,top:200,bottom:587};
 // Try nearby "flower-bed" locations first, then expand in a golden-angle
 // spiral. Bounding rectangles include each illustration's true extremities.
 for(let attempt=0;attempt<240;attempt++){
  const angle=(seq+attempt)*2.3999632297+offset+rand(i,705)*.38;
  const radius=Math.sqrt((seq+.65)/4)+attempt*.075;
  const x=a.x+Math.cos(angle)*a.rx*radius+(rand(i,711)-.5)*11;
  const y=a.y+Math.sin(angle)*a.ry*radius+(rand(i,712)-.5)*8;
  const rect=footprint(i,x,y);
  // Keep the entrance clear and protect the scene's upper and lower UI areas.
  if(rect.top<275||rect.bottom>574||overlaps(rect,castleArea))continue;
  if(occupied(rect))continue;
  reserve(rect);
  return {x,y};

 // For exceptionally crowded kingdoms, extend the meadow horizontally rather
 // than stack drawings. This loop is bounded and uses the same collision rules.

  const column=Math.floor(step/5),row=step%5;
  const x=500+side*(500+ch*60+column*69+(rand(i,832)-.5)*9);
  const y=344+row*48+(rand(i,833)-.5)*9;

  if(!occupied(rect)){
   reserve(rect);
   return {x,y};

}
function extraXY(i){
 const token=state.seed+':'+JSON.stringify(state.themes);
 if(layoutToken!==token){layoutToken=token;placedExtras=[];layoutBuckets=new Map();}
 while(placedExtras.length<=i)placedExtras.push(positionFor(placedExtras.length));

function terrainDetail(){
 let out='';
 const patches=['#d0dda8','#e5d3bc','#c9d8d3','#e2d5cf'];
 for(let i=0;i<extra.length;i++){
  if(i%3!==0)continue;
  const {x,y}=extraXY(i),type=themeAt(i),c=patches[Object.keys(themes).indexOf(type)]||patches[0];
  const rx=47+rand(i,714)*23,ry=22+rand(i,715)*17;
  out+=`<ellipse cx="${x}" cy="${y+9}" rx="${rx}" ry="${ry}" fill="${c}" opacity=".30" transform="rotate(${(rand(i,717)-.5)*29} ${x} ${y+9})"/>`;

 // Winding stepping-stone trails make expansion feel like a growing world.

 <div><label for="goalInput">原定目標（題）</label><input id="goalInput" class="number-input" type="number" inputmode="numeric" min="1" max="500" value="${state.target}"></div></div>
 <label for="kingdomInput">王國名字（可留空）</label><input id="kingdomInput" class="text-input" maxlength="40" placeholder="例如：星光城堡">
 <div class="presets">${[20,50,100,200].map(n=>`<button data-n="${n}" class="preset ${n===state.target?'active':''}">${n}</button>`).join('')}</div>
 <p class="meta-line">✨ 每座城堡都有不同配色和塔樓造型</p><div id="error" class="warn"></div>
 <button class="primary" id="start">🏰 開始建造我的城堡</button>
 ${restart?'<button id="backupNow" class="minor-action">💾 先下載現有進度</button><button id="cancel" class="quiet">取消，返回王國</button>':''}`);
 document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
  $('goalInput').value=b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('active',x===b));
 });
 $('start').onclick=()=>{
  const n=Number($('goalInput').value),kid=$('kidName').value.trim(),title=$('kingdomInput').value.trim();
  if(!Number.isInteger(n)||n<1||n>500){$('error').textContent='請輸入 1 至 500 的整數';return;}
  if(!kid){$('error').textContent='請輸入小朋友的名字';return;}
  stopFireworks();state=fresh();state.target=n;state.seed=seed();state.name=kid.slice(0,30);state.kingdom=title.slice(0,40);
  makeSlots();replay();selected=null;persist();home();render();closeDialog();notice('第一粒積木，準備出發吧！');
 };
 if(restart){$('cancel').onclick=closeDialog;$('backupNow').onclick=backup;}
}
function resumeDialog(){
 dialog(`<div class="dialog-art">🏰</div><h2>${esc(state.name)}，歡迎回來！</h2>
 <p>你已完成 <b>${allCount()}</b> 題，還有 <b>${lit.size}</b> 道勇氣光芒！${state.finalized?'<br>👑 王國已正式完成。':''}</p>
 <button class="primary" id="resume">${state.finalized?'👑 欣賞我的王國':'🏰 繼續我的勇氣故事'}</button>
 <button class="quiet" id="newWorld">開始一座新王國</button>`);
 $('resume').onclick=()=>{closeDialog();if(state.finalized){fit();resultDialog();}};
 $('newWorld').onclick=()=>newDialog(true);
}
const fileSafe=s=>String(s).replace(/[\\/:*?"<>|]/g,'_').slice(0,50)||'勇氣城堡';
function download(blob,filename){
 const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),45000);
}
function backup(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),`${fileSafe(name())}_建造紀錄.json`);}
function roundRect(ctx,x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.closePath();
}
async function exportPNG(){
 const button=$('downloadPNG');if(button){button.disabled=true;button.textContent='⏳ 正在製作紀念畫…';}
 try{
  const poster=document.createElement('canvas');poster.width=2560;poster.height=1440;
  const ctx=poster.getContext('2d');if(!ctx)throw Error('Canvas unavailable');
  ctx.fillStyle='#fff5e7';ctx.fillRect(0,0,2560,1440);
  ctx.strokeStyle='#e7cddb';ctx.lineWidth=12;ctx.strokeRect(42,42,2476,1356);
  ctx.fillStyle='#755b7b';ctx.textAlign='center';ctx.font='bold 87px sans-serif';ctx.fillText(name().slice(0,24),1280,142);
  ctx.fillStyle='#a084a5';ctx.font='32px sans-serif';ctx.fillText('COURAGE CASTLE · 每一份努力，都值得被記住',1280,202);
  const b=edges(),w=b.max-b.min+120,h=b.bottom-b.top+140;
  const raw=`<svg xmlns="http://www.w3.org/2000/svg" width="2324" height="880" viewBox="${b.min-60} ${b.top-60} ${w} ${h}" preserveAspectRatio="xMidYMid meet">${sceneParts()}</svg>`;
  const blob=new Blob([raw],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);
  try{
   const image=new Image();
   await new Promise((ok,fail)=>{image.onload=ok;image.onerror=fail;image.src=url;});
   ctx.fillStyle='#fff0dd';ctx.fillRect(118,237,2324,880);
   ctx.drawImage(image,118,237,2324,880);
  }finally{URL.revokeObjectURL(url);}
  [['完成題目',allCount()],['原定目標',state.target],['額外挑戰',extra.length],['勇敢改正',lit.size]].forEach(([label,value],i)=>{
   const x=440+i*560;
   ctx.fillStyle='white';roundRect(ctx,x-170,1135,340,146,24);ctx.fill();
   ctx.fillStyle='#8a6c8d';ctx.font='bold 62px sans-serif';ctx.fillText(String(value),x,1206);
   ctx.fillStyle='#b198a2';ctx.font='bold 28px sans-serif';ctx.fillText(label,x,1257);
  });
  const date=new Date(state.finalDate||Date.now()).toLocaleDateString('zh-HK',{year:'numeric',month:'2-digit',day:'2-digit'});
  ctx.fillStyle='#987b92';ctx.font='29px sans-serif';ctx.fillText('你用努力建造城堡，也用勇氣讓它閃耀。',1280,1350);
  ctx.font='23px sans-serif';ctx.fillText(`建造者：${state.name}　·　完成日期：${date}`,1280,1387);
  const png=await new Promise(r=>poster.toBlob(r,'image/png'));if(!png)throw Error('PNG failed');
  download(png,`${fileSafe(name())}_${allCount()}題_${date.replaceAll('/','-')}.png`);
  notice('紀念畫已準備好！記得珍藏你的勇氣王國。',true);
 }catch(e){notice('圖片製作未成功，請再試一次或下載建造紀錄。');}
 finally{if(button?.isConnected){button.disabled=false;button.textContent='📸 下載專屬王國紀念畫';}}
}
function settingsDialog(){
 dialog(`<div class="dialog-art">⚙️</div><h2>王國設定</h2><p>${esc(name())}<br>已完成 ${allCount()} 題，${lit.size} 道勇氣光芒。</p>
 <button id="return" class="primary">🏰 返回王國</button>
 <button id="backupNow" class="minor-action">💾 下載建造紀錄</button>
 <button id="importNow" class="minor-action">📂 匯入建造紀錄</button>
 <input type="file" id="importFile" accept=".json,application/json" hidden>
 ${state.finalized?'<button id="resultNow" class="minor-action">👑 欣賞完成作品</button>':''}
 <button id="newWorld" class="quiet">開始一座新王國</button>`);
 $('return').onclick=closeDialog;$('backupNow').onclick=backup;
 $('newWorld').onclick=()=>newDialog(true);
 if($('resultNow'))$('resultNow').onclick=resultDialog;
 $('importNow').onclick=()=>$('importFile').click();
 $('importFile').onchange=async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
   if(file.size>2500000)throw Error('Too big');
   const parsed=readData(JSON.parse(await file.text()));if(!parsed)throw Error('Not V2');
   if(!confirm('匯入會取代此瀏覽器目前的王國進度，確定繼續？'))return;
   state=parsed;makeSlots();replay();selected=null;persist();home();render();closeDialog();notice('建造紀錄已成功恢復！');
  }catch(err){notice('這個檔案不是有效的勇氣城堡 V2 紀錄。');}
 };
}
function navigation(){
 $('zoomIn').onclick=()=>{cam.zoom=clamp(cam.zoom*1.25,.07,4);applyCamera();};
 $('zoomOut').onclick=()=>{cam.zoom=clamp(cam.zoom/1.25,.07,4);applyCamera();};
 $('fitAll').onclick=fit;$('goHome').onclick=home;
 const stage=$('stage');
 stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=false;
  try{stage.setPointerCapture(e.pointerId);}catch(err){}
 });
 stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>7)moved=true;
  if(moved){const v=cameraView(),rect=stage.getBoundingClientRect();
   cam.x=drag.cx-dx*v.width/rect.width;cam.y=drag.cy-dy*v.height/rect.height;applyCamera();}
 });
 stage.addEventListener('pointerup',()=>{drag=null;});
 stage.addEventListener('pointercancel',()=>{drag=null;});
 stage.addEventListener('wheel',e=>{if(e.target.closest('button'))return;
  e.preventDefault();cam.zoom=clamp(cam.zoom*(e.deltaY>0?.91:1.1),.07,4);applyCamera();
 },{passive:false});
 svg.addEventListener('click',e=>{
  if(moved||busy||state.finalized)return;
  const node=e.target.closest('[data-oid]');if(!node)return;
  const id=node.dataset.oid;if(lit.has(id))return;
  selected=selected===id?null:id;render();
  notice(selected?'已選好！按「勇敢改正」讓它閃耀 ✨':'已取消選取');
 });
}
$('add').onclick=()=>action('add');
$('shine').onclick=()=>action('shine');
$('undo').onclick=undo;
$('finish').onclick=finishDialog;
$('replayCelebration').onclick=()=>fireworks('replay');
$('settings').onclick=()=>{if(!busy)settingsDialog();};
$('sound').onclick=()=>{state.sound=!state.sound;persist();render();if(state.sound)music('add');};
$('fullscreen').onclick=async()=>{try{
 if(document.fullscreenElement)await document.exitFullscreen();
 else await document.documentElement.requestFullscreen();
}catch(e){notice('這個瀏覽器未能進入全螢幕');}};
addEventListener('resize',applyCamera);
navigation();
const found=load();
if(!found){state=fresh();state.seed=seed();makeSlots();replay();}
home();
render();
if(found)resumeDialog();else newDialog();
})();

</script>
</body>
</html>
